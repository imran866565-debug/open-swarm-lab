# OPEN SWARM — full distributed-inference experiment.
# Runs on free GitHub-hosted Ubuntu runners. No paid services, no secrets.
# All RPC endpoints bind 127.0.0.1 only. The three nodes are LOGICAL nodes
# on ONE runner VM — see README.md / docs/multi-runner-investigation.md.
name: Open Swarm Experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "swarm/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/swarm-experiment.yml"

permissions:
  contents: read

concurrency:
  group: open-swarm-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake git curl

      - name: Fast unit tests (no model)
        run: python -m unittest discover -s tests -v

      - name: Run the Open Swarm experiment
        env:
          LLAMA_CPP_REF: v1.0.0
        run: python scripts/run_experiment.py --max-tokens 96

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-swarm-results
          path: |
            results/metrics.json
            results/TEST_REPORT.md
            results/coordinator-state.json
            results/logs/
          if-no-files-found: warn
          retention-days: 30
